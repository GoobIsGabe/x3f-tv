<!DOCTYPE html>
<!-- X3F DUEL - tug-of-war vs an AI. Complete reps to pull the flag to your side. -->
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>X3F Duel</title>
<link rel="manifest" href="manifest.json"><meta name="theme-color" content="#06080e"><link rel="apple-touch-icon" href="apple-touch-icon.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="X3F"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;800&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#06080e;--panel:rgba(255,255,255,.05);--brd:rgba(255,255,255,.09);--brd2:rgba(255,255,255,.14);--txt:#eaf0fa;--dim:#8593a9;--accent:#2ff0b0;--accentD:#0fae82;--gold:#ffd35c;--hot:#ff5d78;--d:'Sora',system-ui,-apple-system,'Segoe UI',sans-serif;--n:'Space Grotesk',system-ui,-apple-system,'Segoe UI',sans-serif;--sat:env(safe-area-inset-top);--sab:env(safe-area-inset-bottom)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;overscroll-behavior:none}
body{font-family:var(--d);color:var(--txt);background:var(--bg);-webkit-user-select:none;user-select:none}
.app{position:relative;height:100dvh;max-width:820px;margin:0 auto;display:flex;flex-direction:column;padding-top:var(--sat)}
.topbar{display:flex;align-items:center;gap:8px;padding:12px 14px 6px;flex-wrap:wrap}
.brand{font-weight:800;font-size:17px;letter-spacing:2px}.brand b{color:var(--accent)}
.spacer{flex:1}
.status{display:inline-flex;align-items:center;gap:7px;padding:7px 12px;border-radius:100px;background:var(--panel);border:1px solid var(--brd);font-size:12px;color:var(--dim);font-family:var(--n)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--hot)}.dot.on{background:var(--accent);box-shadow:0 0 12px var(--accent)}.dot.wait{background:var(--gold)}
select,.mini{font-family:var(--n);font-weight:700;font-size:12px;background:var(--panel);color:var(--txt);border:1px solid var(--brd2);border-radius:11px;padding:9px 11px;cursor:pointer}
.stage{flex:1;min-height:0;position:relative;overflow:hidden}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
.hud{position:absolute;top:10px;left:10px;right:10px;display:flex;gap:8px;pointer-events:none;flex-wrap:wrap}
.chip{background:rgba(10,14,22,.66);backdrop-filter:blur(6px);border:1px solid var(--brd);border-radius:14px;padding:8px 13px;min-width:78px}
.chip .k{font-family:var(--n);font-size:10px;letter-spacing:1.5px;text-transform:uppercase;color:var(--dim)}
.chip .v{font-family:var(--n);font-weight:700;font-size:20px}
.v.accent{color:var(--accent)}.v.gold{color:var(--gold)}
.toast{position:absolute;left:0;right:0;top:36%;text-align:center;font-family:var(--n);font-weight:700;font-size:clamp(1.6rem,7vw,2.6rem);opacity:0;transition:opacity .3s;pointer-events:none;text-shadow:0 4px 30px #000}
.toast.show{opacity:1}
.ctrl{display:flex;gap:8px;align-items:center;padding:8px 12px calc(8px + var(--sab));border-top:1px solid var(--brd);background:linear-gradient(180deg,transparent,rgba(0,0,0,.4))}
.cta{font-family:var(--d);font-weight:700;font-size:16px;border:none;border-radius:14px;padding:14px 18px;cursor:pointer;background:linear-gradient(180deg,var(--accent),var(--accentD));color:#04120c}
.cta:active{transform:translateY(1px)}.cta.ghost{background:var(--panel);color:var(--txt);border:1px solid var(--brd2)}
.grow{flex:1}
.scrim{position:fixed;inset:0;background:rgba(4,6,11,.74);backdrop-filter:blur(8px);display:flex;align-items:center;justify-content:center;z-index:30;opacity:0;pointer-events:none;transition:opacity .25s;padding:24px}
.scrim.show{opacity:1;pointer-events:auto}
.card{width:100%;max-width:420px;text-align:center;display:flex;flex-direction:column;gap:14px}
.card h1{font-size:28px;font-weight:800}.card h1 b{color:var(--accent)}.card p{color:var(--dim);font-size:14px;line-height:1.55}
</style></head>
<body>
<div class="app">
<div class="topbar">
<button onclick="history.length>1?history.back():location.href='index.html'" aria-label="Back" style="display:inline-flex;align-items:center;justify-content:center;width:38px;height:38px;border-radius:11px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.14);color:#eaf0fa;font-size:22px;font-weight:700;line-height:1;flex:0 0 auto;cursor:pointer;font-family:inherit">&lsaquo;</button>
<button onclick="x3tv()" aria-label="TV mode" style="display:inline-flex;align-items:center;justify-content:center;height:38px;padding:0 12px;border-radius:11px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.14);color:#eaf0fa;font-size:12px;font-weight:800;letter-spacing:1px;cursor:pointer;font-family:inherit;flex:0 0 auto">TV</button>
<div class="brand">X3F <b>DUEL</b></div><div class="spacer"></div>
<div class="status"><span class="dot" id="dot"></span><span id="statusTxt">Offline</span></div>
<select id="bandSel" title="Band"></select>
</div>
<div class="stage" id="stage">
<canvas id="cv"></canvas>
<div class="hud">
<div class="chip"><div class="k">Round</div><div class="v accent" id="hRound">1</div></div>
<div class="chip"><div class="k">Reps</div><div class="v" id="hReps">0</div></div>
<div class="chip"><div class="k">Best Round</div><div class="v gold" id="hBest">0</div></div>
</div>
<div class="toast" id="toast"></div>
</div>
<div class="ctrl">
<button class="cta ghost" id="zeroBtn">Re-Zero</button>
<div class="grow"></div>
<button class="cta" id="startBtn">New Match</button>
</div>
</div>
<div class="scrim show" id="firstrun"><div class="card">
<h1>X3F <b>DUEL</b></h1>
<p>Tug-of-war against the machine. Every full rep - pull hard to the peak, then release - yanks the rope your way. The CPU pulls on a cadence that gets faster each round. Out-rep it to win and climb the rounds.</p>
<button class="cta" id="frConnect">Connect Bar</button>
<button class="cta ghost" id="frDemo">Try Demo (hold to pull)</button>
</div></div>
<script>
"use strict";
const SERVICE='e3458900-6ed5-40ff-aa3a-4e9a87ce1ad6',CH_FORCE='e3458901-6ed5-40ff-aa3a-4e9a87ce1ad6';
const $=id=>document.getElementById(id);
function xget(k,d){try{return JSON.parse(localStorage.getItem('x3f_'+k))??d}catch(e){return d}}
function xset(k,v){try{localStorage.setItem('x3f_'+k,JSON.stringify(v))}catch(e){}}
function logSession(o){try{const h=JSON.parse(localStorage.getItem('x3f_history')||'[]');h.push(Object.assign({t:Date.now(),b:band},o));while(h.length>250)h.shift();localStorage.setItem('x3f_history',JSON.stringify(h))}catch(e){}}
const BAND_DEF={'White':130,'Light Gray':230,'Dark Gray':330,'Black':430,'Elite Black':600};
const BANDS=['White','Light Gray','Dark Gray','Black','Elite Black'];
let band=xget('band','White'),bandMax=Object.assign({},BAND_DEF,xget('bandMax',{}));
function ref(){return Math.max(60,bandMax[band]||130)}
let bestRound=xget('duelBest',0);$('hBest').textContent=bestRound;
const bandSel=$('bandSel');
BANDS.forEach(b=>{const o=document.createElement('option');o.value=b;o.textContent=b+' band';o.selected=b===band;bandSel.appendChild(o)});
bandSel.onchange=()=>{band=bandSel.value;xset('band',band)};
(function(){const p=new URLSearchParams(location.search);const bd=p.get('band');if(bd&&BAND_DEF[bd]){band=bd;xset('band',band);bandSel.value=band;}})();

let device=null,connected=false,demo=false,raw=0,baseline=null,taring=false,tSamp=[],tStart=0,tEnd=0,force=0;
function setStatus(t,c){$('statusTxt').textContent=t;$('dot').className='dot'+(c?' '+c:'')}
async function connect(){
  if(!navigator.bluetooth){setStatus('No Web Bluetooth','');alert('Bluetooth needs Chrome on Android, or the free Bluefy browser on iPhone (App Store). Or press Demo to play without the bar.');return;}
  if(!window.isSecureContext){setStatus('Not secure','');alert('Serve over https or localhost.');return;}
  try{setStatus('Scanning...','wait');
    device=await navigator.bluetooth.requestDevice({acceptAllDevices:true,optionalServices:[SERVICE]});
    device.addEventListener('gattserverdisconnected',()=>{connected=false;setStatus('Disconnected','')});
    setStatus('Connecting...','wait');
    const srv=await(await device.gatt.connect()).getPrimaryService(SERVICE);
    const fc=await srv.getCharacteristic(CH_FORCE);await fc.startNotifications();
    fc.addEventListener('characteristicvaluechanged',e=>{raw=e.target.value.getFloat64(0,true);onSample()});
    demo=false;connected=true;$('firstrun').classList.remove('show');startTare();
  }catch(e){console.error(e);if(e.name==='NotFoundError'){setStatus('No bar found','');alert('No device selected, or nothing advertising.')}else{setStatus(e.name,'')}}
}
function startTare(){taring=true;tSamp=[];tStart=performance.now()+400;tEnd=performance.now()+1900;setStatus('Zeroing - hold still','wait')}
function onSample(){
  if(taring){const n=performance.now();if(n>=tStart)tSamp.push(raw);if(n>=tEnd){baseline=tSamp.length?tSamp.reduce((a,b)=>a+b,0)/tSamp.length:raw;taring=false;setStatus(demo?'Demo':'Live','on')}return;}
  if(baseline==null)baseline=raw;force=Math.max(0,raw-baseline);
}
let demoF=0,pull=false;
function startDemo(){demo=true;connected=false;baseline=0;$('firstrun').classList.remove('show');setStatus('Demo','on');
  if(!startDemo.l)startDemo.l=setInterval(()=>{if(pull)demoF=Math.min(ref()*1.05,demoF+ref()*0.07+2);else demoF=Math.max(0,demoF*0.8-3);raw=demoF;onSample()},27)}
$('stage').addEventListener('pointerdown',()=>{if(demo)pull=true});addEventListener('pointerup',()=>pull=false);
addEventListener('keydown',e=>{if(e.code==='Space'){pull=true;e.preventDefault()}});addEventListener('keyup',e=>{if(e.code==='Space')pull=false});
$('frConnect').onclick=connect;$('frDemo').onclick=startDemo;
$('zeroBtn').onclick=()=>{if(demo){baseline=0}else startTare()};

let ac=null;function beep(f,d){try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();const o=ac.createOscillator(),g=ac.createGain();o.frequency.value=f;o.connect(g);g.connect(ac.destination);g.gain.setValueAtTime(0.001,ac.currentTime);g.gain.exponentialRampToValueAtTime(0.25,ac.currentTime+0.01);g.gain.exponentialRampToValueAtTime(0.001,ac.currentTime+d);o.start();o.stop(ac.currentTime+d+0.03)}catch(e){}}
function toast(t){$('toast').textContent=t;$('toast').classList.add('show');toast.e=performance.now()+1500}

const cv=$('cv'),ctx=cv.getContext('2d');let W=0,H=0,DPR=1;
function resize(){DPR=Math.min(devicePixelRatio||1,2);W=cv.clientWidth;H=cv.clientHeight;cv.width=W*DPR;cv.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0)}
addEventListener('resize',resize);
let running=false,round=1,flag=0,reps=0,st='down',peakF=0,aiNext=0,reason='';
let duelRounds=0;
function startMatch(){ if(duelRounds>0&&window.X3FSet){X3FSet.report({g:'duel',score:duelRounds});duelRounds=0;}
  running=true;round=1;newRound();$('startBtn').textContent='Restart';toast('ROUND 1');beep(660,0.12)}
function newRound(){flag=0;reps=0;st='down';peakF=0;aiNext=performance.now()+aiPeriod();$('hReps').textContent=0;$('hRound').textContent=round}
function aiPeriod(){return Math.max(820,1900-round*150)}
function aiPull(){return 0.055+round*0.008}
function loop(now){
  if(!W)resize();
  const R=ref(),hi=R*0.6,lo=R*0.2;
  // rep detection
  if(running){
    if(force>peakF)peakF=force;
    if(st==='down'&&force>hi){st='up'}
    else if(st==='up'&&force<lo){ // rep complete
      const qual=Math.max(0,Math.min(1,(peakF-hi)/(R-hi)));
      flag+=0.07+0.07*qual;reps++;$('hReps').textContent=reps;peakF=0;st='down';beep(760,0.05);if(navigator.vibrate)navigator.vibrate(25);
      if(flag>=1){round++;if(round-1>bestRound){bestRound=round-1;xset('duelBest',bestRound);$('hBest').textContent=bestRound;}duelRounds=round-1;toast('ROUND '+round);beep(900,0.18);newRound();}
    }
    if(now>=aiNext){flag-=aiPull();aiNext=now+aiPeriod();
      if(flag<=-1){running=false;reason='lose';toast('CPU wins - round '+round);beep(300,0.3);$('startBtn').textContent='New Match';
        // one log entry per MATCH, not per round
        if(window.X3FSet){X3FSet.report({g:'duel',score:duelRounds});duelRounds=0;}}}
  }
  // draw
  ctx.clearRect(0,0,W,H);
  const cy=H*0.52;
  // side wash
  const g1=ctx.createLinearGradient(0,0,W,0);g1.addColorStop(0,'rgba(255,93,120,.12)');g1.addColorStop(.5,'rgba(0,0,0,0)');g1.addColorStop(1,'rgba(47,240,176,.12)');
  ctx.fillStyle=g1;ctx.fillRect(0,0,W,H);
  // rope
  ctx.strokeStyle='rgba(255,255,255,.2)';ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(W*0.08,cy);ctx.lineTo(W*0.92,cy);ctx.stroke();
  // center + goal lines
  ctx.strokeStyle='rgba(255,255,255,.12)';ctx.lineWidth=1;
  [0.08,0.5,0.92].forEach(fx=>{ctx.beginPath();ctx.moveTo(W*fx,cy-40);ctx.lineTo(W*fx,cy+40);ctx.stroke()});
  // flag knot
  const fx=W*(0.5+flag*0.42);
  ctx.fillStyle='#ffd35c';ctx.shadowColor='#ffd35c';ctx.shadowBlur=18;ctx.beginPath();ctx.arc(fx,cy,14,0,7);ctx.fill();ctx.shadowBlur=0;
  ctx.fillStyle='#8593a9';ctx.font="600 13px 'Space Grotesk'";ctx.textAlign='left';ctx.fillText('CPU',W*0.08,cy-52);ctx.textAlign='right';ctx.fillText('YOU',W*0.92,cy-52);ctx.textAlign='left';
  // your force gauge (bottom)
  const gw=W-40,gx=20,gy=H-46,fr=Math.min(1.05,force/R);
  ctx.fillStyle='rgba(255,255,255,.06)';ctx.fillRect(gx,gy,gw,14);
  ctx.fillStyle=force>hi?'#2ff0b0':(force<lo?'#8593a9':'#ffd35c');ctx.fillRect(gx,gy,gw*Math.min(1,fr),14);
  ctx.strokeStyle='#2ff0b0';ctx.lineWidth=2;const hx=gx+gw*(hi/R);ctx.beginPath();ctx.moveTo(hx,gy-4);ctx.lineTo(hx,gy+18);ctx.stroke();
  ctx.fillStyle='#8593a9';ctx.font="11px 'Space Grotesk'";ctx.fillText('pull past the line, then release = 1 rep',gx,gy-8);
  if(toast.e&&now>toast.e){$('toast').classList.remove('show');toast.e=0}
  requestAnimationFrame(loop);
}
$('startBtn').onclick=startMatch;
resize();requestAnimationFrame(loop);
</script>
<script>function x3tv(){try{if(document.fullscreenElement||document.webkitFullscreenElement){(document.exitFullscreen||document.webkitExitFullscreen).call(document);return}var el=document.documentElement,rf=el.requestFullscreen||el.webkitRequestFullscreen;var r=rf.call(el);Promise.resolve(r).then(function(){if(screen.orientation&&screen.orientation.lock)return screen.orientation.lock("landscape")}).catch(function(){})}catch(e){}}</script>
<script>(function(){var wl=null;function req(){if(wl||!('wakeLock'in navigator)||document.visibilityState!=='visible')return;navigator.wakeLock.request('screen').then(function(s){wl=s;s.addEventListener&&s.addEventListener('release',function(){wl=null;});}).catch(function(){});}document.addEventListener('visibilitychange',function(){if(document.visibilityState==='visible')req();});window.addEventListener('pointerdown',req,{passive:true});req();})();</script>
<script>if('serviceWorker'in navigator){addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){})})}</script>
<script src="x3f-progress.js"></script>
<script src="x3f-set.js"></script>
<script src="x3f-music.js"></script>
<script>/* soundtrack: reacts to your pull where the page exposes one */
addEventListener("load",function(){try{
  var f=function(){ try{ return Math.min(1,(force/ref())*1.05); }catch(e){ return 0.25; } };
  X3FMusic.attach({mood:"duel",getIntensity:f,
    buttonHost:document.querySelector(".topbar")||document.body,buttonClass:"mini"});
}catch(e){}});</script>
<script>/* let the reporter measure peak force and time under tension itself */
addEventListener('load',function(){try{X3FSet.watch(function(){return force},function(){return ref()});}catch(e){}});</script>
</body></html>
