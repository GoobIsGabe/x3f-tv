plugins {
    id 'com.android.application'
}

android {
    namespace 'com.goob.x3ftv'
    compileSdk 34

    defaultConfig {
        applicationId 'com.goob.x3ftv'
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName '0.1-probe'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

dependencies {
}
