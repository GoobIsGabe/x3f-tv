plugins {
    id 'com.android.application'
}

android {
    namespace 'com.goob.x3ftv'
    compileSdk 34

    signingConfigs {
        debug {
            storeFile file('x3f-debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    defaultConfig {
        applicationId 'com.goob.x3ftv'
        minSdk 24
        targetSdk 34
        versionCode 17
        versionName '1.7'
    }

    buildFeatures {
        buildConfig true
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

dependencies {
}
