<!DOCTYPE html>
<!-- X3F TV launcher — bubbly game-style home. Self-contained: own D-pad nav (window.__x3fNav),
     live force meter (window.__x3fForce fed by native), bar status + battery
     (window.__x3fSetBar / window.__x3fSetBattery),
     update flow (X3F.checkUpdate / window.__x3fUpdate). Navigates to a game via location.href. -->
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>X3F</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#05030f;--txt:#eee9ff;--dim:#a99fd6;--accent:#8f7dff;--cyan:#37e6ff;--mint:#39f5c4;--gold:#ffd23f;--hot:#ff5d78;
 --d:'Fredoka',system-ui,sans-serif;--n:'Space Grotesk',system-ui,sans-serif}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden}
body{font-family:var(--d);color:var(--txt);background:var(--bg);user-select:none;-webkit-user-select:none}

.wrap{position:relative;z-index:1;height:100dvh;display:flex;flex-direction:column;padding:3.2vh 4vw}
.top{display:flex;align-items:center;gap:16px}
.logo{height:12vh;max-height:96px;width:auto;filter:drop-shadow(0 6px 24px rgba(143,125,255,.45))}
.spacer{flex:1}
/* the bar chip is a control, not a label: OK on it opens the picker, and when the
   bar is live it carries the battery so you can tell it really is YOUR bar */
.status{display:inline-flex;align-items:center;gap:9px;padding:10px 18px;border-radius:100px;background:rgba(20,14,44,.6);border:2px solid rgba(160,140,255,.25);font-family:var(--n);font-weight:600;font-size:2.1vh;color:var(--dim);backdrop-filter:blur(8px);cursor:pointer;transition:transform .12s,box-shadow .12s,border-color .12s}
.status.foc{transform:scale(1.06);border-color:#fff;box-shadow:0 0 22px rgba(143,125,255,.7)}
.status.warn{border-color:rgba(255,211,63,.65);color:var(--gold)}
.status .batt{font-weight:700;color:var(--mint)}
.status .batt.low{color:var(--hot)}
.dot{width:11px;height:11px;border-radius:50%;background:var(--hot)}
.dot.on{background:var(--mint);box-shadow:0 0 14px var(--mint)}
.dot.wait{background:var(--gold);animation:pulse 1s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
.meterwrap{display:flex;align-items:center;gap:14px;margin:2.4vh 0 1vh}
.meterlabel{font-family:var(--n);font-size:1.9vh;letter-spacing:2px;text-transform:uppercase;color:var(--dim);white-space:nowrap}
.meter{flex:1;height:2.4vh;min-height:16px;border-radius:100px;background:rgba(255,255,255,.08);overflow:hidden;border:1px solid rgba(160,140,255,.2)}
.mfill{height:100%;width:0;border-radius:100px;background:linear-gradient(90deg,var(--cyan),var(--mint));box-shadow:0 0 18px var(--mint);transition:width .04s linear}
.mval{font-family:var(--n);font-weight:700;font-size:2.4vh;color:var(--mint);min-width:2.6em;text-align:right;font-variant-numeric:tabular-nums}
.bandrow{display:flex;gap:1.1vw;margin-bottom:2vh;flex-wrap:wrap}
.pill{font-family:var(--d);font-weight:600;font-size:2vh;padding:1vh 2vw;border-radius:100px;background:rgba(20,14,44,.55);border:2px solid rgba(160,140,255,.22);color:var(--dim);cursor:pointer;transition:transform .12s,box-shadow .12s,border-color .12s}
.pill.sel{color:#0c0722;background:linear-gradient(180deg,var(--accent),#6f5ae0);border-color:transparent}
.grid{flex:1;display:grid;grid-template-columns:repeat(4,1fr);grid-auto-rows:1fr;gap:1.6vw;min-height:0}
.card{position:relative;border-radius:22px;background:linear-gradient(165deg,rgba(30,20,60,.9),rgba(12,8,28,.9));border:2px solid rgba(160,140,255,.16);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1vh;cursor:pointer;overflow:hidden;transition:transform .14s cubic-bezier(.2,.9,.3,1.3),box-shadow .14s,border-color .14s}
.card .ic{font-size:6.4vh;line-height:1;filter:drop-shadow(0 4px 14px rgba(0,0,0,.5))}
.card .nm{font-family:var(--d);font-weight:700;font-size:2.5vh;letter-spacing:.5px}
.card .tag{font-family:var(--n);font-size:1.6vh;color:var(--dim)}
.card .glow{position:absolute;inset:-40% -40% auto -40%;height:120%;background:radial-gradient(closest-side,var(--c,#8f7dff),transparent);opacity:.16;pointer-events:none}
/* the guided workout is the headline card, not just another game */
.card.hero{border-color:rgba(57,245,196,.5);background:linear-gradient(165deg,rgba(24,60,52,.92),rgba(10,22,26,.92))}
.card.hero .glow{opacity:.26}
.card.hero .nm{color:var(--mint)}
.foc{outline:none}
.card.foc{transform:scale(1.075) translateY(-2px);border-color:var(--c,#8f7dff);box-shadow:0 0 0 3px rgba(255,255,255,.08),0 18px 44px rgba(0,0,0,.55),0 0 34px var(--c,#8f7dff)}
.pill.foc{transform:scale(1.09);border-color:#fff;box-shadow:0 0 22px rgba(143,125,255,.7)}
.updrow{display:flex;align-items:center;gap:14px;margin-top:2vh}
.upd{font-family:var(--d);font-weight:600;font-size:2vh;padding:1.2vh 2.4vw;border-radius:100px;background:rgba(20,14,44,.55);border:2px solid rgba(160,140,255,.3);color:var(--txt);cursor:pointer;transition:transform .12s,box-shadow .12s}
.upd.foc{transform:scale(1.06);border-color:#fff;box-shadow:0 0 22px rgba(57,245,196,.6)}
.updmsg{font-family:var(--n);font-size:1.9vh;color:var(--dim)}
/* today's programme: what to train, how the week is going, the streak */
.prog{display:flex;align-items:center;gap:1.4vw;margin-bottom:1.6vh;padding:1.1vh 1.6vw;border-radius:16px;
 background:rgba(20,14,44,.5);border:1px solid rgba(160,140,255,.22);flex-wrap:wrap}
.prog .pd{font-family:var(--d);font-weight:700;font-size:2.4vh}
.prog .pd b{color:var(--mint)}
.prog .pw{font-family:var(--n);font-size:1.8vh;color:var(--dim)}
.prog .pstreak{font-family:var(--n);font-weight:700;font-size:2.1vh;color:var(--gold)}
.prog .pchal{font-family:var(--n);font-size:1.8vh;color:var(--txt);flex:1;min-width:38%}
.prog .pchal em{font-style:normal;color:var(--gold)}
.prog .pchal.done em{color:var(--mint)}
/* Manual bar picker. It used to be a block in this column, so opening it stole
   height from .grid (flex:1) and squashed every card - and it opened itself after
   9s, unasked. It is now a modal off the bar chip: nothing else moves. */
.scrim{position:fixed;inset:0;z-index:40;display:none;align-items:center;justify-content:center;background:rgba(4,2,12,.82);backdrop-filter:blur(6px)}
.scrim.show{display:flex}
.sheet{width:min(80vw,920px);max-height:84vh;overflow:auto;padding:3.4vh 3vw;border-radius:26px;
 background:linear-gradient(165deg,rgba(30,20,60,.98),rgba(12,8,28,.98));border:2px solid rgba(255,211,63,.35);
 box-shadow:0 30px 80px rgba(0,0,0,.7)}
.sheet h2{font-family:var(--d);font-weight:700;font-size:3.4vh;color:var(--gold)}
.sheet .sub{font-family:var(--n);font-size:1.9vh;color:var(--dim);margin:.6vh 0 2.2vh}
.findrow{display:flex;gap:1vw;flex-wrap:wrap;margin-bottom:2.2vh}
.sheetbtns{display:flex;gap:1vw;flex-wrap:wrap}
.dev{font-family:var(--d);font-weight:600;font-size:1.9vh;padding:1vh 1.6vw;border-radius:100px;background:rgba(20,14,44,.7);border:2px solid rgba(160,140,255,.28);color:var(--txt);cursor:pointer;max-width:30vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dev.foc{transform:scale(1.06);border-color:#fff;box-shadow:0 0 22px rgba(255,211,63,.6)}
.dev small{display:block;font-family:var(--n);font-size:1.4vh;color:var(--dim)}
.hint{font-family:var(--n);font-size:1.7vh;color:#6f6790}
</style></head>
<body>
<!-- shared menu nav: reuse this page's own .foc focus look -->
<script>window.X3FNAV_CLASS='foc';</script>
<script src="x3f-exercises.js"></script>
<script src="x3f-progress.js"></script>
<script src="x3f-music.js"></script>
<script src="x3f-fx.js"></script>
<script src="x3f-nav.js"></script>
<div class="wrap">
  <div class="top">
    <img class="logo" src="logo.png" alt="X3 Force Bar Games" onerror="this.style.display='none'">
    <div class="spacer"></div>
    <button class="status nav" id="barChip" data-nav><span class="dot" id="dot"></span><span id="statusTxt">Connecting…</span><span class="batt" id="battTxt"></span></button>
  </div>

  <div class="meterwrap">
    <span class="meterlabel">Pull to test</span>
    <div class="meter"><div class="mfill" id="mfill"></div></div>
    <span class="mval" id="mval">0</span>
  </div>

  <div class="bandrow" id="bandrow"></div>

  <div class="prog" id="prog"></div>
  <div class="grid" id="grid"></div>

  <div class="updrow">
    <button class="upd nav" id="updBtn" data-act="update" data-nav>⟳ Check for updates</button>
    <span class="updmsg" id="updMsg"></span>
    <span class="spacer"></span>
    <span class="hint" id="verHint"></span>
  </div>
</div>

<div class="scrim" id="finder">
  <div class="sheet">
    <h2>Pick your bar</h2>
    <div class="sub" id="findSub">Everything Bluetooth has seen this session<span id="findCount"></span></div>
    <div class="findrow" id="findList"></div>
    <div class="sheetbtns">
      <button class="upd nav" id="rescanBtn" data-nav data-nav-first>⟳ Scan again</button>
      <button class="upd nav" id="closeFind" data-nav>Close</button>
    </div>
  </div>
</div>
<script>
"use strict";
window.__x3fLauncher=true;
const $=id=>document.getElementById(id);
function xget(k,d){try{return JSON.parse(localStorage.getItem('x3f_'+k))??d}catch(e){return d}}
function xset(k,v){try{localStorage.setItem('x3f_'+k,JSON.stringify(v))}catch(e){}}
const BAND_DEF={'White':130,'Light Gray':230,'Dark Gray':330,'Black':430,'Elite Black':600};
const BANDS=['White','Light Gray','Dark Gray','Black','Elite Black'];
let band=xget('band','White'); if(BANDS.indexOf(band)<0)band='White';
let bandMax=Object.assign({},BAND_DEF,xget('bandMax',{}));
function ref(){return Math.max(60,bandMax[band]||BAND_DEF[band]||130)}

// Workout first, then the games, then the tools. Card 1 takes initial focus.
const GAMES=[
 {nm:'Workout',   f:'routine.html',   ic:'📋', c:'#39f5c4', tag:'guided push / pull', hero:1},
 {nm:'Nova',      f:'nova.html',      ic:'🚀', c:'#8f7dff', tag:'space defense'},
 {nm:'Splash',    f:'splash.html',    ic:'🌊', c:'#37c8ff', tag:'underwater'},
 {nm:'Bloom',     f:'bloom.html',     ic:'🌸', c:'#ff9ecf', tag:'rep garden'},
 {nm:'Flow',      f:'flow.html',      ic:'〰️', c:'#39f5c4', tag:'trace the wave'},
 {nm:'Arena',     f:'arena.html',     ic:'⚔️', c:'#ff8a5c', tag:'survive'},
 {nm:'Duel',      f:'duel.html',      ic:'⚡', c:'#ff5d78', tag:'head to head'},
 {nm:'Rhythm',    f:'rhythm.html',    ic:'🎵', c:'#ffd23f', tag:'hit the beat'},
 {nm:'Library',   f:'library.html',   ic:'📚', c:'#ffb45c', tag:'every movement'},
 {nm:'Progress',  f:'progress.html',  ic:'📈', c:'#9be36f', tag:'your history'},
 {nm:'Calibrate', f:'calibrate.html', ic:'🎯', c:'#8fe0c4', tag:'set your bands'},
];

// ---- band pills ----
const bandrow=$('bandrow');
BANDS.forEach(b=>{const el=document.createElement('button');el.className='pill nav'+(b===band?' sel':'');el.dataset.band=b;el.textContent=b;
  el.setAttribute('data-nav','');el.onclick=()=>selectBand(b);bandrow.appendChild(el);});
function selectBand(b){band=b;xset('band',b);[...bandrow.children].forEach(p=>p.classList.toggle('sel',p.dataset.band===b));}

// ---- game cards ----
const grid=$('grid');
GAMES.forEach((g,i)=>{const el=document.createElement('div');el.className='card nav'+(g.hero?' hero':'');el.style.setProperty('--c',g.c);el.dataset.f=g.f;
  el.setAttribute('data-nav','');el.setAttribute('tabindex','-1');if(i===0)el.setAttribute('data-nav-first','');
  el.innerHTML='<div class="glow" style="--c:'+g.c+'"></div><div class="ic">'+g.ic+'</div><div class="nm">'+g.nm+'</div><div class="tag">'+g.tag+'</div>';
  el.onclick=()=>{
    try{xset('band',band);}catch(e){}
    try{ const r=el.getBoundingClientRect(); X3FFX.burst(r.left+r.width/2,r.top+r.height/2,g.c); X3FFX.pulse(.8); }catch(e){}
    if(window.X3FFX&&X3FFX.leave)X3FFX.leave(g.f); else location.href=g.f;
  };
  grid.appendChild(el);});

// ---- today's programme ----
(function(){
  var P=window.X3FProg; if(!P)return;
  try{
    var pr=P.program(), st=P.streak(), c=P.challenge();
    var day=pr.doneToday?'Done today':(pr.nextType+' day');
    $('prog').innerHTML=
      '<span class="pd">'+(pr.active?'<b>'+day+'</b>':'<b>Start the program</b>')+'</span>'+
      '<span class="pw">'+(pr.active?('Week '+pr.week+' · '+pr.thisWeek+'/'+pr.perWeek+' this week'):'12 weeks, one set per lift')+'</span>'+
      '<span class="pstreak">'+st.current+' day streak</span>'+
      '<span class="pchal'+(c.done?' done':'')+'"><em>'+(c.done?'✅ Challenge done':'🎯 '+c.title)+'</em> — '+c.detail+'</span>';
  }catch(e){}
})();

// ---- update button ----
$('updBtn').onclick=()=>{ try{ if(window.X3F&&X3F.checkUpdate){ $('updMsg').textContent='Checking…'; X3F.checkUpdate(); } else { $('updMsg').textContent='Updates only in the TV app'; } }catch(e){ $('updMsg').textContent='Update error'; } };
window.__x3fUpdate=function(msg){ try{ $('updMsg').textContent=msg||''; }catch(e){} };
window.__x3fVersion=function(v){ try{ $('verHint').textContent=v?('v'+v):''; }catch(e){} };

// ---- bar status (native calls this) ----
let barLive=false, barText='Connecting…', stale=false;
function paintChip(){
  const c=$('barChip'), needsHelp=(!barLive&&stale);
  c.classList.toggle('warn',needsHelp);
  $('statusTxt').textContent=needsHelp?((barText||'Bar not found')+' · OK to pick'):(barText||'');
}
window.__x3fSetBar=function(state,txt){ try{
  $('dot').className='dot'+(state?(' '+state):'');
  barText=txt||''; barLive=(state==='on');
  if(barLive){ stale=false; showFinder(false); }   // connected - put the picker away
  paintChip();
}catch(e){} };

// ---- bar battery ----
// The bar publishes cell millivolts on its own characteristic; same 3.30-4.20V
// map the games use, so the number reads the same everywhere. It is also the
// cheapest proof that the thing that connected is actually your bar.
window.__x3fSetBattery=function(mv){ try{
  const t=$('battTxt');
  if(!(mv>0)){ t.className='batt'; t.textContent=''; return; }
  const pct=Math.max(0,Math.min(100,Math.round((mv-3300)/900*100)));
  t.className='batt'+(pct<=20?' low':'');
  t.textContent='🔋 '+pct+'%';
}catch(e){} };

// ---- manual bar picker ----
// Scanning cannot see a bar that is already connected to something, or one whose
// advertisement carries no name and no service UUID. The raw list is the escape
// hatch - reached from the bar chip, as a modal, so it never resizes the page.
let devices=[];
function renderDevices(){
  const list=$('findList');
  list.innerHTML='';
  if(!devices.length){
    const e=document.createElement('div');e.className='updmsg';
    e.textContent='Nothing seen yet — wake the bar (load a band) and hit Scan again.';
    list.appendChild(e);
  } else devices.forEach(d=>{
    const b=document.createElement('button');
    b.className='dev nav';b.setAttribute('data-nav','');
    b.innerHTML=(d.n||'(unnamed)')+'<small>'+d.a+'</small>';
    b.onclick=()=>{ $('statusTxt').textContent='Connecting…'; try{ X3F.pickDevice(d.a); }catch(e){} };
    list.appendChild(b);
  });
  $('findCount').textContent=devices.length?('  ·  '+devices.length+' seen'):'';
  if(window.X3FNav)X3FNav.refresh();
}
/* Tell native an overlay is up, so Back closes it instead of dropping the whole
   app to the home screen. */
function showFinder(on){
  $('finder').classList.toggle('show',!!on);
  if(on)renderDevices();
  try{ if(window.X3F&&X3F.setOverlay)X3F.setOverlay(!!on); }catch(e){}
  if(window.X3FNav)X3FNav.refresh();
}
window.__x3fCloseOverlay=function(){ try{ showFinder(false); }catch(e){} };
window.__x3fDevices=function(list){ try{ devices=list||[]; if($('finder').classList.contains('show'))renderDevices(); }catch(e){} };
$('barChip').onclick=()=>showFinder(true);
$('closeFind').onclick=()=>showFinder(false);
$('rescanBtn').onclick=()=>{ try{ if(window.X3F&&X3F.rescan){ barText='Rescanning…'; paintChip(); X3F.rescan(); } }catch(e){} };
// Not connected after a few seconds: say so on the chip and point at OK. Opening
// the picker unasked is what used to shove the cards around.
setTimeout(()=>{ if(!barLive){ stale=true; paintChip(); } },9000);

// ---- D-pad spatial nav ----
// Handled by the shared x3f-nav.js (loaded below, reusing this page's .foc look).
// It requires the target to actually share your row before it will move there,
// which the old scoring here did not: from a card, a band pill one row up could
// out-score the card right beside you, so Right off Workout landed on a grey
// band and Left off Nova landed on Black.
setTimeout(()=>{ try{ if(window.X3FNav && !X3FNav.current()) X3FNav.focusFirst(); }catch(e){} },140);

// ---- live force meter ----
const mfill=$('mfill'),mval=$('mval');
function meter(){ let f=+window.__x3fForce||0; const pct=Math.max(0,Math.min(100,f/ref()*100));
  mfill.style.width=pct+'%'; mval.textContent=Math.round(f); requestAnimationFrame(meter); }
requestAnimationFrame(meter);

// ---- soundtrack ----
(function(){ try{ X3FMusic.attach({mood:'menu',buttonHost:document.querySelector('.updrow'),buttonClass:'upd nav'}); }catch(e){} })();

// ---- ambient background ----
// This used to be a second rAF loop drawing bubbles. X3FFX owns the ambience now
// (aurora, motes, vignette, grain) in ONE loop that sheds work if the TV cannot
// keep up, so this page went from two loops to one.
(function(){ try{ X3FFX.mount({image:'assets/ui/aurora.jpg'}); }catch(e){} })();
</script>
</body></html>
