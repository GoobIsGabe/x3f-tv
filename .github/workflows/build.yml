name: Build APK

# Builds the TV APK, publishes it to the "latest" release, and mirrors it plus
# version.txt to the dist branch, which is what the in-app updater reads.
#
# paths-ignore, because this workflow force-pushes to dist and moves the "latest"
# release tag - i.e. every run changes what the TV offers to download. Editing a
# markdown file should not do that. Anything that can end up inside the APK
# (app/, web/, tools/, gradle config) still triggers it.
on:
  push:
    branches: [ main ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  workflow_dispatch:

permissions:
  contents: write

# Two pushes a minute apart used to race: the second job could finish first and
# publish, then the first job force-pushed ITS version.txt over the top - leaving
# the updater comparing against a version number from a different build than the
# APK sitting on the release. Serialise, and drop superseded runs.
concurrency:
  group: build-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The bundle in app/src/main/assets/ is GENERATED from web/. Nothing has
      # ever enforced that, so an APK could be built - and offered to the TV by
      # the updater - from assets that no longer match the source they came from.
      # That is worse than a red build: it ships. One second, no browser needed.
      # Fix a failure by running `python tools/sync-from-web.py` and committing.
      - name: Bundle is in sync with web/
        run: python3 tools/sync-from-web.py --check

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Stage APK
        run: cp app/build/outputs/apk/debug/app-debug.apk x3f-tv.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: x3f-tv-apk
          path: x3f-tv.apk

      - name: Publish to "latest" release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: X3F TV — latest build
          files: x3f-tv.apk
          body: >
            Auto-built X3F TV APK. In-app updater checks version.txt on the dist branch.

      - name: Mirror APK + version to dist branch (git-fetchable + updater source)
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          grep -m1 versionCode app/build.gradle | grep -o '[0-9]\+' > version.txt
          echo "published versionCode: $(cat version.txt)"
          git checkout -B dist
          git add -f x3f-tv.apk version.txt
          git commit -m "APK + version ${GITHUB_SHA}" || echo "no change"
          git push -f origin dist
