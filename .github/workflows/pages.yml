name: Publish web games

# The phone version of X3F, for free, with no service to run and nothing that can
# collide with another project: this takes web/ exactly as it is and publishes it
# to the gh-pages branch. Turn it on once under Settings -> Pages -> Deploy from a
# branch -> gh-pages / (root), and https://goobisgabe.github.io/x3f-tv/ serves the
# games over https, which is what Web Bluetooth needs on a phone.
#
# web/ stays the single source of truth. Nothing is copied into main.
#
# ONE thing is rewritten on the way out, and only one: the service worker's cache
# name. Everything else is published byte for byte, so what you read in web/ is
# what the phone runs. See the stamp step for why that exception has to exist.

on:
  push:
    branches: [ main ]
    paths:
      - 'web/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: write

# gh-pages is force-pushed. Two pushes in quick succession could otherwise land
# out of order and publish the older tree.
concurrency:
  group: publish-pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # A service worker is only replaced when sw.js's OWN BYTES change, and its
      # activate handler only drops caches whose name differs from the current
      # one. Publishing a fixed page while the cache name stayed 'x3f-v8' meant
      # every returning visitor kept the old worker and was served the old page
      # out of the old cache - permanently, with no way out short of clearing
      # site data. "The fix didn't ship."
      #
      # Stamping the commit into the name means sw.js changes whenever anything
      # in web/ does, so the worker updates and the previous cache is discarded.
      # grep first: a silent no-op here would reinstate exactly the bug this
      # step exists to remove, and it would look like a green deploy.
      - name: Stamp the service-worker cache with this commit
        run: |
          grep -q "^const C = 'x3f-dev';" web/sw.js || {
            echo "web/sw.js no longer has the line this step rewrites."
            echo "Restore \"const C = 'x3f-dev';\" or update this step - without it"
            echo "returning visitors keep serving the previous build from cache."
            exit 1
          }
          sed -i "s/^const C = 'x3f-dev';/const C = 'x3f-${GITHUB_SHA}';/" web/sw.js
          grep -m1 "^const C" web/sw.js

      - name: Publish web/ to gh-pages
        run: |
          set -euo pipefail
          git config user.name github-actions
          git config user.email github-actions@github.com
          # a .nojekyll file, or GitHub Pages hides anything starting with an underscore
          touch web/.nojekyll
          # the phone build is the web build - no rewriting, no second copy
          git checkout --orphan gh-pages-tmp
          git rm -rq --cached . || true
          find . -maxdepth 1 ! -name web ! -name .git ! -name . -exec rm -rf {} +
          # One move, dotfiles included, so .nojekyll and every subdirectory
          # (assets/, fonts/) come across in the same pass. The old form was
          #   mv web/* web/.nojekyll . 2>/dev/null || mv web/* .
          # whose fallback re-ran the move after a PARTIAL first one and then
          # failed on the entries that had already moved.
          shopt -s dotglob
          mv web/* .
          shopt -u dotglob
          rmdir web
          ls -d fonts assets 2>/dev/null || echo "note: no fonts/ or assets/ in this publish"
          git add -A
          # `git commit || echo "no change"` swallowed real failures - a hook, a
          # bad identity, a full disk - and then force-pushed whatever gh-pages
          # happened to be. Ask first, so only "nothing to publish" is tolerated.
          if git diff --cached --quiet; then
            echo "nothing changed; not publishing"
            exit 0
          fi
          git commit -m "web games ${GITHUB_SHA}"
          git branch -M gh-pages
          git push -f origin gh-pages
