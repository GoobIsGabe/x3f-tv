name: Publish web games

# The phone version of X3F, for free, with no service to run and nothing that can
# collide with another project: this takes web/ exactly as it is and publishes it
# to the gh-pages branch. Turn it on once under Settings -> Pages -> Deploy from a
# branch -> gh-pages / (root), and https://goobisgabe.github.io/x3f-tv/ serves the
# games over https, which is what Web Bluetooth needs on a phone.
#
# web/ stays the single source of truth. Nothing is copied into main.

on:
  push:
    branches: [ main ]
    paths:
      - 'web/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Publish web/ to gh-pages
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          # a .nojekyll file, or GitHub Pages hides anything starting with an underscore
          touch web/.nojekyll
          # the phone build is the web build - no rewriting, no second copy
          git checkout --orphan gh-pages-tmp
          git rm -rq --cached . || true
          find . -maxdepth 1 ! -name web ! -name .git ! -name . -exec rm -rf {} +
          mv web/* web/.nojekyll . 2>/dev/null || mv web/* .
          rmdir web 2>/dev/null || true
          git add -A
          git commit -m "web games ${GITHUB_SHA}" || echo "no change"
          git branch -M gh-pages
          git push -f origin gh-pages
